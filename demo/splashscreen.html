<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تاجر</title>
<style>
  :root {
    --gold: #e3b341;
    --gold-soft: rgba(227, 179, 65, 0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  /* ===== المسرح ===== */
  .stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
  }

  /* ===== توهج خلفي متحرك ===== */
  .glow {
    position: absolute;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold-soft) 0%, transparent 65%);
    filter: blur(10px);
    animation: glowPulse 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.18); opacity: 1; }
  }

  /* ===== رموز محاسبية طافية ===== */
  .symbols {
    position: absolute; inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .symbols span {
    position: absolute;
    bottom: -40px;
    color: rgba(255, 255, 255, 0.07);
    font-weight: 700;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    88% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(24deg); opacity: 0; }
  }

  /* ===== اللوجو ===== */
  .logo-wrap {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center;
    z-index: 2;
  }
  .logo {
    direction: ltr;
    display: flex;
    font-size: clamp(44px, 12vw, 76px);
    font-weight: 900;
    letter-spacing: 2px;
    color: #ffffff;
    line-height: 1;
  }
  .logo .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(26px);
    animation: letterIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: calc(0.15s + var(--i) * 0.11s);
  }
  @keyframes letterIn {
    to { opacity: 1; transform: translateY(0); }
  }
  .logo .dot { color: var(--gold); }

  /* حرف G وبداخله أزرار الآلة الحاسبة */
  .logo .g { position: relative; }
  .logo .calc {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -42%);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2.5px;
    width: 0.34em; height: 0.34em;
  }
  .logo .calc i {
    display: block;
    border-radius: 1.5px;
    background: rgba(255, 255, 255, 0.18);
    animation: btnLight 0.5s forwards;
    animation-delay: calc(0.9s + var(--b) * 0.22s);
  }
  @keyframes btnLight {
    to { background: var(--gold); box-shadow: 0 0 8px rgba(227, 179, 65, 0.9); }
  }

  .brand-ar {
    margin-top: 10px;
    color: #ffffff;
    font-size: clamp(20px, 5vw, 27px);
    font-weight: 800;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay: 0.95s;
  }
  .tagline {
    color: rgba(255, 255, 255, 0.5);
    font-size: clamp(11px, 3vw, 13.5px);
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay: 1.1s;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== شريط التحميل ===== */
  .progress-zone {
    margin-top: 26px;
    width: min(240px, 62vw);
    display: flex; flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 2;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    animation-delay: 1.25s;
  }
  .bar {
    width: 100%; height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 99px;
    overflow: hidden;
    position: relative;
  }
  .bar .fill {
    height: 100%; width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #b8860b, var(--gold), #f6d47c);
    background-size: 200% 100%;
    transition: width 0.35s ease;
    position: relative;
    overflow: hidden;
  }
  .bar .fill::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: translateX(-100%);
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer {
    to { transform: translateX(100%); }
  }
  .msg {
    color: rgba(255, 255, 255, 0.65);
    font-size: 12.5px;
    min-height: 18px;
    transition: opacity 0.25s ease;
  }

  /* ===== الخروج: انقسام الشاشة ===== */
  .split {
    position: fixed;
    left: 0; right: 0; height: 50.5%;
    background: #0a0a0a;
    z-index: 10;
    pointer-events: none;
    transition: transform 0.55s cubic-bezier(0.7, 0, 0.3, 1);
  }
  .split.top { top: 0; border-bottom: 2px solid transparent; }
  .split.bottom { bottom: 0; border-top: 2px solid transparent; }
  body.exiting .split.top {
    transform: translateY(-101%);
    border-bottom-color: var(--gold);
  }
  body.exiting .split.bottom {
    transform: translateY(101%);
    border-top-color: var(--gold);
  }
  body.exiting .logo-wrap {
    animation: logoOut 0.5s ease forwards;
  }
  @keyframes logoOut {
    to { transform: scale(1.14); opacity: 0; }
  }
  body.exiting .progress-zone,
  body.exiting .glow,
  body.exiting .symbols {
    transition: opacity 0.3s ease;
    opacity: 0 !important;
  }

  /* ===== تقليل الحركة ===== */
  @media (prefers-reduced-motion: reduce) {
    .logo .ch, .brand-ar, .tagline, .progress-zone {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .logo .calc i { animation: none !important; background: var(--gold); }
    .glow { animation: none !important; }
    .symbols { display: none; }
    .bar .fill::after { animation: none !important; display: none; }
    body.exiting .logo-wrap { animation: none !important; opacity: 0; }
    .split { transition-duration: 0.2s; }
  }
</style>
</head>
<body>
  <div class="split top"></div>
  <div class="split bottom"></div>

  <div class="stage">
    <div class="symbols" id="symbols"></div>
    <div class="glow"></div>

    <div class="logo-wrap" id="logoWrap">
      <div class="logo" aria-label="TAGER">
        <span class="ch" style="--i:0">T</span><span class="ch" style="--i:1">A</span><span class="ch g" style="--i:2">G<span class="calc"><i style="--b:0"></i><i style="--b:1"></i><i style="--b:2"></i><i style="--b:3"></i></span></span><span class="ch" style="--i:3">E</span><span class="ch" style="--i:4">R</span><span class="ch dot" style="--i:5">.</span>
      </div>
      <div class="brand-ar">تاجر</div>
      <div class="tagline">برنامج محاسبي متكامل</div>
    </div>

    <div class="progress-zone">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="msg" id="msg">جاري تجهيز المخزون...</div>
    </div>
  </div>

<script>
(function () {
  "use strict";
  /* TEMP-DEBUG: تتبع تسلسل شاشة البداية — يُحذف بعد التأكد من الإصلاح */
  var SPLASH_DEBUG = true;
  function slog() {
    if (!SPLASH_DEBUG) return;
    try { console.log.apply(console, ["[splash]"].concat(Array.prototype.slice.call(arguments))); } catch (e) {}
  }
  slog("boot: splashscreen.html loaded");
  var fill = document.getElementById("fill");
  var msg = document.getElementById("msg");
  var exited = false;
  var progress = 0;

  /* رموز طافية */
  var glyphs = ["+", "−", "×", "÷", "%", "ج.م", "123", "="];
  var symbolsBox = document.getElementById("symbols");
  for (var i = 0; i < 14; i++) {
    var s = document.createElement("span");
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = (Math.random() * 92) + "%";
    s.style.fontSize = (14 + Math.random() * 22) + "px";
    s.style.animationDuration = (7 + Math.random() * 6) + "s";
    s.style.animationDelay = (Math.random() * 7) + "s";
    symbolsBox.appendChild(s);
  }

  var MESSAGES = [
    [0, "جاري تجهيز المخزون..."],
    [35, "تحميل الفواتير..."],
    [65, "مراجعة الحسابات..."],
    [92, "اللمسات الأخيرة..."],
    [100, "جاهز!"]
  ];

  function render() {
    fill.style.width = progress + "%";
    var text = MESSAGES[0][1];
    for (var k = 0; k < MESSAGES.length; k++) {
      if (progress >= MESSAGES[k][0]) text = MESSAGES[k][1];
    }
    if (msg.textContent !== text) {
      msg.style.opacity = "0";
      setTimeout(function () { msg.textContent = text; msg.style.opacity = "1"; }, 180);
    }
  }

  function setProgress(p) {
    if (exited) return;
    progress = Math.max(progress, Math.min(100, p));
    render();
  }

  /* تقدم تلقائي احتياطي — يصل لـ 90% خلال ~2.4 ثانية لو مفيش إشارات حقيقية */
  var autoTimer = setInterval(function () {
    if (exited || progress >= 90) { clearInterval(autoTimer); return; }
    setProgress(progress + 7);
  }, 190);

  function startExit() {
    if (exited) return;
    exited = true;
    clearInterval(autoTimer);
    setProgress(100);
    setTimeout(function () {
      document.body.classList.add("exiting");
      /* إغلاق النافذة بعد انتهاء حركة الخروج */
      setTimeout(closeSelf, 650);
    }, 320);
  }

  /* يغلق النافذة مع إعادة المحاولة كل 500ms (حتى 10 محاولات) — المحاولة
     الواحدة كانت تعلّق الشاشة على الأبيض للأبد عند أي فشل عابر */
  var closeAttempts = 0;
  function closeSelf() {
    closeAttempts++;
    slog("closeSelf: attempt " + closeAttempts);
    try {
      var w = window.__TAURI__ && window.__TAURI__.window;
      if (w && w.getCurrentWindow) {
        w.getCurrentWindow().then(function (win) {
          slog("closeSelf: got window, closing");
          return win.close();
        }).then(function () {
          slog("closeSelf: closed ok");
        }).catch(function (err) {
          retryClose(err);
        });
        return;
      }
      retryClose(new Error("no __TAURI__.window.getCurrentWindow"));
    } catch (e) { retryClose(e); }
  }

  function retryClose(err) {
    if (closeAttempts < 10) {
      setTimeout(closeSelf, 500);
      return;
    }
    console.error("[splash] closeSelf failed after 10 attempts:", err);
    /* احتياطي أخير */
    try { window.close(); } catch (e) {}
  }

  /* إشارات التقدم الحقيقية من نافذة البرنامج الرئيسية */
  function bindTauri() {
    try {
      var ev = window.__TAURI__ && window.__TAURI__.event;
      if (!ev || !ev.listen) return false;
      ev.listen("splash-progress", function (e) {
        var p = e && e.payload;
        if (p && typeof p.percent === "number") {
          clearInterval(autoTimer);
          setProgress(p.percent);
        }
      }).catch(function () {});
      ev.listen("splash-exit", function () { slog("received splash-exit"); startExit(); }).catch(function () {});
      slog("tauri events bound");
      return true;
    } catch (e) { return false; }
  }

  /* Tauri قد يتأخر في حقن الـ API — حاول عدة مرات */
  var attempts = 0;
  var bindTimer = setInterval(function () {
    attempts++;
    if (bindTauri() || attempts > 40) clearInterval(bindTimer);
  }, 100);

  /* صمام أمان: لو مفيش إشارة خروج خلال 12 ثانية، اقفل بنفسك */
  setTimeout(function () { if (!exited) startExit(); }, 12000);
})();
</script>
</body>
</html>
